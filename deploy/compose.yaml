# Local / single-host deployment for the payment service.
#
#   docker compose -f deploy/compose.yaml up -d --build
#
# The API applies embedded migrations on startup, so no manual migration step
# is required. Caddy (HTTPS) runs only when the "proxy" profile is enabled:
#
#   docker compose -f deploy/compose.yaml --profile proxy up -d

name: kazna

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  DATABASE_URL: postgres://${POSTGRES_USER:-kazna}:${POSTGRES_PASSWORD:-kazna}@postgres:5432/${POSTGRES_DB:-kazna}?sslmode=disable
  # DEV ONLY defaults so `docker compose up` works out of the box. Generate real
  # values for anything non-local: `make keygen` and `openssl rand -hex 24`.
  MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-9f2c1e7a4b6d8f0a1c3e5b7d9f0a2c4e6b8d0f1a3c5e7b9d0f2a4c6e8b0d1f3a}
  MASTER_ENCRYPTION_PREVIOUS_KEYS: ${MASTER_ENCRYPTION_PREVIOUS_KEYS:-}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
  ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
  PAYMENT_POLL_INTERVAL: ${PAYMENT_POLL_INTERVAL:-30s}
  YOOKASSA_API_URL: ${YOOKASSA_API_URL:-https://api.yookassa.ru}
  PROVIDER_IDEMPOTENCY_WINDOW: ${PROVIDER_IDEMPOTENCY_WINDOW:-24h}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kazna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kazna}
      POSTGRES_DB: ${POSTGRES_DB:-kazna}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host exposure is optional; api/worker reach postgres over the compose
    # network. Uncomment to connect from local tooling.
    # ports:
    #   - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kazna} -d ${POSTGRES_DB:-kazna}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kazna/app:${IMAGE_TAG:-local}
    command: ["/usr/local/bin/api"]
    restart: unless-stopped
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kazna/app:${IMAGE_TAG:-local}
    command: ["/usr/local/bin/worker"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  caddydata:
  caddyconfig:
